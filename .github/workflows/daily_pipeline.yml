name: Daily jobs pipeline

on:
  schedule:
    - cron: '30 0 * * *'    # 00:30 UTC = 06:00 IST
  workflow_dispatch:         # adds a manual "Run workflow" button

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      ADZUNA_APP_ID:        ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:       ${{ secrets.ADZUNA_APP_KEY }}
      SUPABASE_DB_HOST:     ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT:     ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_USER:     ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_NAME:     ${{ secrets.SUPABASE_DB_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest job postings
        working-directory: ingestion
        run: python3 ingest.py

      - name: Run dbt
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt seed
          dbt build